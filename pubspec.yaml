name: misskey_client
version: 1.0.0-beta.7
documentation: https://librarylibrarian.github.io/misskey_client/
environment:
  sdk: ">=3.9.0 <4.0.0"
description: A pure Dart client library for the Misskey API. Covers 25 API domains with token-based auth, automatic retry, and structured error handling.
dependencies:
  collection: ^1.19.1
  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logger: ^2.7.0
  meta: ^1.15.0
  retry: ^3.1.2
  web_socket_channel: ^3.0.3
dev_dependencies:
  build_runner: ^2.15.1
  freezed: 3.2.5
  json_serializable: ^6.14.1
  lints: ^6.1.0
  test: ^1.31.0
repository: https://github.com/LibraryLibrarian/misskey_client
topics:
  - misskey
  - fediverse
  - api-client
  - social-media
  - activitypub
